---

kind: pipeline
type: docker

steps:
  - name: fetch git tags
    image: alpine/git
    commands:
      - git fetch --tags

  - name: restore cache
    image: drillster/drone-volume-cache
    volumes:  # mount the cache volume, needs "Trusted"
      - name: cache
        path: /cache
    settings:
      restore: true
      mount:
        - dev/builder/ckbuilder

  - name: tests
    image: openjdk:12
    commands:
      - yum -y install git
      - dev/builder/build.sh

  - name: create draft release
    image: plugins/github-release
    settings:
      draft: true
      files: dev/builder/release/ckeditor_${DRONE_TAG}.tar.gz
      checksum:
        - sha256
      api_key:
        from_secret: github_token
    when:
      event: tag

  # If this step fails while creating a new release, then manually delete the
  # draft release on Github before relaunching the release job on the CI.
  - name: wait for draft release
    image: tolteck/base
    commands:
      - |
          RELEASE_URL="https://api.github.com/repos/tolteck/ckeditor4/releases"
          DELAY=2
          for i in 1 2 3; do
            releases=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \\
                       "$RELEASE_URL?per_page=10")
            if echo "$releases" | grep -qF '"tag_name": "'"$DRONE_TAG"'"'; then
              exit 0
            fi
            echo "Release for tag ${DRONE_TAG} still not visible," \\
                 "waiting $DELAY seconds..."
            sleep "$DELAY"
            DELAY=$((DELAY * 2))
          done
          echo "Release not found for tag ${DRONE_TAG}, aborting." \\
               "This can be caused by" \\
               "https://github.com/tolteck/coatl/pull/1420#discussion_r3458730327"
          exit 1
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    when:
      event: tag

  - name: publish release
    image: plugins/github-release
    settings:
      api_key:
        from_secret: github_token
    when:
      event: tag

  - name: rebuild cache
    image: drillster/drone-volume-cache
    volumes:  # mount the cache volume, needs "Trusted"
      - name: cache
        path: /cache
    settings:
      rebuild: true
      mount:
        - dev/builder/ckbuilder

volumes:
  - name: cache
    host:
      path: /tmp/cache
